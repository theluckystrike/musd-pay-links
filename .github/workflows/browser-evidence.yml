name: Browser wallet evidence

on:
  push:
    branches: ['sprint/**']
    paths:
      - scripts/browser-evidence.mjs
      - .github/workflows/browser-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-wallet-${{ github.ref }}
  # An active wallet send must finish and record its result before another run starts.
  cancel-in-progress: false

jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned project dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the task-only wallet secret is configured
        env:
          MUSD_EVIDENCE_MNEMONIC: ${{ secrets.MUSD_EVIDENCE_MNEMONIC }}
        run: |
          test -n "$MUSD_EVIDENCE_MNEMONIC" || { echo 'Task-only evidence wallet is not configured.'; exit 1; }
      - name: Download and verify the official MetaMask extension
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --max-time 120 --output metamask-chrome-13.55.0.zip https://github.com/MetaMask/metamask-extension/releases/download/v13.55.0/metamask-chrome-13.55.0.zip
          curl --fail --location --retry 2 --max-time 30 --output SHA256SUMS https://github.com/MetaMask/metamask-extension/releases/download/v13.55.0/SHA256SUMS
          awk '$2 == "metamask-chrome-13.55.0.zip" { print }' SHA256SUMS | sha256sum --check --strict
          mkdir metamask
          unzip -q metamask-chrome-13.55.0.zip -d metamask
          mkdir -p "$GITHUB_WORKSPACE/.reports/browser"
          sha256sum metamask-chrome-13.55.0.zip > "$GITHUB_WORKSPACE/.reports/browser/metamask-package.sha256"
      - name: Install Chromium and its system dependencies on the hosted runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the local preview
        run: pnpm build
      - name: Start an isolated local Worker
        run: |
          set -euo pipefail
          mkdir -p .reports/browser
          setsid pnpm exec wrangler dev --local --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/musd-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/musd-worker.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Local Worker did not become ready.'
          exit 1
      - name: Use the actual MetaMask UI and prove a testnet invoice payment
        env:
          MUSD_EVIDENCE_MNEMONIC: ${{ secrets.MUSD_EVIDENCE_MNEMONIC }}
          MUSD_EVIDENCE_PAYER_ADDRESS: ${{ vars.MUSD_EVIDENCE_PAYER_ADDRESS }}
          MUSD_EVIDENCE_MERCHANT_ADDRESS: ${{ vars.MUSD_EVIDENCE_MERCHANT_ADDRESS }}
          MUSD_EVIDENCE_AMOUNT: '1'
          MUSD_EVIDENCE_ORIGIN: http://127.0.0.1:8787
          METAMASK_EXTENSION_PATH: ${{ runner.temp }}/metamask
        run: timeout 20m xvfb-run -a --server-args='-screen 0 1440x1000x24' node scripts/browser-evidence.mjs
      - name: Stop only this job's Worker
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/musd-worker.pid"; then
            worker_pid=$(cat "$RUNNER_TEMP/musd-worker.pid")
            kill -- "-$worker_pid" 2>/dev/null || true
          fi
          if test -f "$RUNNER_TEMP/musd-worker.log"; then
            mkdir -p .reports/browser
            cp "$RUNNER_TEMP/musd-worker.log" .reports/browser/server.log
          fi
      - name: Upload public test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-wallet-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .reports/browser/*.json
            .reports/browser/*.png
            .reports/browser/*.sha256
            .reports/browser/server.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
