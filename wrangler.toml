name = "musd-pay-links"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./web/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[limits]
cpu_ms = 50

# Per-client limit on the routes that read the chain (see RATE_LIMIT in src/worker.ts).
[[ratelimits]]
name = "LIMITER"
namespace_id = "31611"
simple = { limit = 30, period = 60 }
