name: Verification

on:
  push:
    branches: [main, 'sprint/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Offline tests
        id: offline
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.reports/offline.json
      - name: Record offline test evidence
        if: ${{ always() && steps.offline.outcome != 'skipped' }}
        env:
          LIVE: '0'
        run: node scripts/record-test-evidence.mjs offline .reports/offline.json
      - name: Type check
        run: pnpm typecheck
      - name: Build browser client
        run: pnpm build
      - name: Read-only live RPC tests
        id: live
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          LIVE: '1'
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.reports/live.json
      - name: Record live test evidence
        if: ${{ always() && steps.live.outcome != 'skipped' }}
        env:
          LIVE: '1'
        run: node scripts/record-test-evidence.mjs live .reports/live.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: .reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
