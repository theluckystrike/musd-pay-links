name = "musd-pay-links"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./web/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[limits]
cpu_ms = 50

# Per-client limit on the routes that read the chain (see RATE_LIMIT in src/worker.ts).
[[ratelimits]]
name = "LIMITER"
namespace_id = "31611"
simple = { limit = 30, period = 60 }

# Merchant invoices (see src/invoices.ts). Entries expire after 30 days.
[[kv_namespaces]]
binding = "INVOICES"
id = "e85bb8a979d544e68fa808c13dd35217"

# Exact per-client limiter (see ClientLimiter in src/worker.ts).
[[durable_objects.bindings]]
name = "CLIENT_LIMITER"
class_name = "ClientLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClientLimiter"]
